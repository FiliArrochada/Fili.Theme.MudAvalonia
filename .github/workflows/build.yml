name: build

# Builds the theme, the gallery and the test suites, publishes the gallery's browser build, and,
# on a push to master, deploys it as the repository's GitHub Pages site:
# https://filiarrochada.github.io/Fili.Theme.MudAvalonia/
#
# Nothing here packs: pushing a NuGet package is a deliberate human step (release.yml, on a tag),
# not a side effect of a green build. The site is deployed only once every test leg has passed.
#
# Pages one-time setup: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# Until that is switched, the deploy job fails. No base-path rewriting is needed: Pages serves a
# project site under /Fili.Theme.MudAvalonia/, and every URL the page loads (./main.js,
# ./_framework/...) is relative, so the same output works there and at the root of a local server.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN. Without this block a workflow inherits the repository
# default, which is often read/write across contents and packages - so a pipeline whose whole
# purpose is to build and test would hold a token that can push commits. The test jobs need no
# more than reading the checkout; upload-artifact uses the Actions runtime token, not this one.
# Only the deploy job is granted the Pages permissions, below.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------------------
  # Linux builds and publishes; Windows builds what it tests and runs the pixel suite.
  #
  # Linux is not here for symmetry. This is a library other people will build on whatever they
  # have, and a Linux job is the only thing that would catch a Windows-only assumption creeping
  # into the theme or the gallery. What it must NOT do is run the pixel baselines: those PNGs
  # were rendered on Windows with Skia, text rasterisation differs across platforms, and a Linux
  # runner would fail all nine frames on glyph edges while nothing was actually wrong. The fix
  # for that day is a second committed set of baselines per platform, not a wider tolerance -
  # one wide enough to cover a different rasteriser would be wide enough to hide a real change.
  #
  # Only Linux builds the browser gallery, and it builds it once, by publishing it: the publish
  # is what the site serves, and building it beforehand as well linked Skia and HarfBuzz into
  # dotnet.wasm twice. That link needs the wasm-tools workload, and installing it on Windows cost
  # every run time for a project no Windows step uses. Windows builds the three test projects
  # instead, which between them reference every other project in the solution.
  # ---------------------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Every project in the solution but the browser gallery, which the publish builds.
            projects: >-
              src/Fili.Theme.MudAvalonia
              src/Fili.Theme.MudAvalonia.Gallery
              src/Fili.Theme.MudAvalonia.Gallery.Desktop
              tst/Fili.Theme.MudAvalonia.UnitTests
              tst/Fili.Theme.MudAvalonia.PixelTests
              tst/Fili.Theme.MudAvalonia.NoDataGridTests
            publish: true
          - os: windows-latest
            projects: tst/Fili.Theme.MudAvalonia.UnitTests tst/Fili.Theme.MudAvalonia.PixelTests tst/Fili.Theme.MudAvalonia.NoDataGridTests
            publish: false

    env:
      # Somewhere the artifact upload below can actually reach. The default is the system temp
      # directory, which is fine on a developer's machine and useless on a runner.
      FILI_PIXEL_DIFF_DIR: ${{ github.workspace }}/artifacts/pixel-diff

    steps:
      - uses: actions/checkout@v7

      # global.json pins the SDK and opts `dotnet test` into Microsoft.Testing.Platform, which
      # xunit v3 needs on SDK 10. Reading the pin rather than restating it here is what keeps
      # the runner on the same SDK as the repository.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        shell: bash
        run: for p in ${{ matrix.projects }}; do dotnet restore "$p"; done

      - name: Build
        shell: bash
        run: for p in ${{ matrix.projects }}; do dotnet build "$p" --configuration Release --no-restore; done

      # The fast suite: no rendering, identical everywhere.
      - name: Test (unit)
        run: >
          dotnet test tst/Fili.Theme.MudAvalonia.UnitTests
          --configuration Release
          --no-build
          --
          --report-xunit-trx
          --results-directory ${{ github.workspace }}/artifacts/test-results

      # The theme in an app without Avalonia.Controls.DataGrid, which it builds against but does
      # not depend on: a DataGrid type leaking out of the optional files fails here and only here.
      - name: Test (no data grid)
        run: >
          dotnet test tst/Fili.Theme.MudAvalonia.NoDataGridTests
          --configuration Release
          --no-build
          --
          --report-xunit-trx
          --results-directory ${{ github.workspace }}/artifacts/test-results

      # The pixel suite: twelve gallery frames, Skia, diffed against committed PNGs. Windows only,
      # for the reason in the job comment above.
      - name: Test (pixel baselines)
        if: runner.os == 'Windows'
        run: >
          dotnet test tst/Fili.Theme.MudAvalonia.PixelTests
          --configuration Release
          --no-build
          --
          --report-xunit-trx
          --results-directory ${{ github.workspace }}/artifacts/test-results

      # The release notes the tag would get: the version's page, its links resolved. A bump that
      # forgot to rename unreleased.md fails here rather than on the tag.
      - name: Check the release notes
        if: matrix.publish
        run: |
          version="$(dotnet msbuild src/Fili.Theme.MudAvalonia/Fili.Theme.MudAvalonia.csproj -getProperty:Version)"
          python3 tools/release-notes.py "$version" "v$version" artifacts/release-notes.md

      # Avalonia.Browser links Skia and HarfBuzz into dotnet.wasm, and that native link is what
      # this workload provides. Without it, even restoring the browser project fails.
      - name: Install wasm-tools workload
        if: matrix.publish
        run: dotnet workload install wasm-tools

      # On every push and pull request, not only before a deploy: the browser build is trimmed,
      # and what trimming breaks shows up here and nowhere else.
      - name: Publish the browser gallery
        if: matrix.publish
        run: >
          dotnet publish src/Fili.Theme.MudAvalonia.Gallery.Browser
          --configuration Release
          --output publish

      # XAML loaded by its path at runtime is found by reflection, so trimming strips it unless a
      # DynamicDependency keeps it - and every test above runs untrimmed. Every docs example once
      # failed on the live site with "No precompiled XAML found" while all of them passed.
      - name: Check the published gallery
        if: matrix.publish
        run: python3 tools/check-gallery-publish.py publish

      - name: Upload Pages artifact
        if: matrix.publish && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore

      # The whole point of the pixel suite is the picture, and a picture left on the runner is
      # no better than no picture. A failure here uploads the rendered frame and the diff image -
      # layout in grey, changed pixels in red - so the change can be judged from the pull request
      # rather than reproduced locally first.
      - name: Upload pixel diffs
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: pixel-diffs
          path: artifacts/pixel-diff/
          if-no-files-found: ignore
          retention-days: 14

  # Deploys the gallery the Linux leg published, once every test leg has passed: a master that
  # fails its tests keeps the site it had.
  deploy:
    name: Deploy the gallery
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and never cancel one halfway: a cancelled deploy can leave the
    # site pointing at a half-uploaded artifact.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
