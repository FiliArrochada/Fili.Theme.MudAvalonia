name: release

# Publishes the Fili.MudAvalonia.Theme package to nuget.org when a version tag is pushed:
#
#   1. bump <Version> in Directory.Build.props, rename docs/versions/unreleased.md to
#      <that version>.md, and commit both
#   2. git tag v<that version> && git push origin v<that version>
#
# The tag must be on master and match <Version> exactly, and the version must have its page, which
# becomes the release notes; the publish job checks all three before packing, so a typo or a missing page fails
# the release instead of shipping a package whose version nobody chose or described.
#
# Authentication is nuget.org trusted publishing: GitHub's OIDC token is exchanged for an API key
# that lives for one hour, so no long-lived key is stored anywhere. One-time setup:
#   - nuget.org -> account -> Trusted Publishing: add a policy for repository owner
#     FiliArrochada, repository Fili.Theme.MudAvalonia, workflow file release.yml
#   - this repository -> Settings -> Secrets and variables -> Actions -> Variables:
#     NUGET_USER = the nuget.org username that owns that policy (a name, not a secret)
#   - this repository -> Settings -> Environments -> nuget: required reviewers (the maintainer),
#     and deployment tags `v*`. The publish job waits there for a reviewer's approval, so a pushed
#     tag alone never reaches nuget.org. Without the environment GitHub creates it on the first
#     run with no rules, and the job runs unattended as before.
#
# Every action is pinned to a commit, its release in the comment: a tag can be moved to other code,
# a commit cannot. Raise them together, to a release's commit.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never two releases of the same tag at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The same gate build.yml applies on Windows: all three suites, pixel baselines included. A tag can
  # point at any commit, including one build.yml never saw go green, so the release checks again.
  test:
    name: Test (windows-latest)
    runs-on: windows-latest
    env:
      FILI_PIXEL_DIFF_DIR: ${{ github.workspace }}/artifacts/pixel-diff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        shell: bash
        run: |
          for p in tst/Fili.Theme.MudAvalonia.UnitTests tst/Fili.Theme.MudAvalonia.PixelTests tst/Fili.Theme.MudAvalonia.NoDataGridTests; do
            dotnet build "$p" --configuration Release
          done

      - name: Test (unit)
        run: dotnet test tst/Fili.Theme.MudAvalonia.UnitTests --configuration Release --no-build

      - name: Test (no data grid)
        run: dotnet test tst/Fili.Theme.MudAvalonia.NoDataGridTests --configuration Release --no-build

      - name: Test (pixel baselines)
        run: dotnet test tst/Fili.Theme.MudAvalonia.PixelTests --configuration Release --no-build

      - name: Upload pixel diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-diffs
          path: artifacts/pixel-diff/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: test
    runs-on: ubuntu-latest
    # The approval gate: see the header.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Fili.MudAvalonia.Theme
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # trusted publishing to nuget.org
    steps:
      # Full history, so the check below can see whether the tagged commit is on master.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # A tag can be pushed on any commit, including one on a branch nobody reviewed. Only what
      # master already holds is released.
      - name: Check the tagged commit is on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master."
            exit 1
          fi

      - name: Check the tag matches the package version
        id: version
        run: |
          version="$(dotnet msbuild src/Fili.Theme.MudAvalonia/Fili.Theme.MudAvalonia.csproj -getProperty:Version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The release notes are the version's page in docs/versions/, its links pointed at the tag.
      # Written before anything is pushed: a version without its page stops here, not after
      # nuget.org has it.
      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet run tools/release-notes.cs -- "$VERSION" "$GITHUB_REF_NAME" artifacts/release-notes.md

      - name: Check trusted publishing is configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Repository variable NUGET_USER is not set. See the header of release.yml."
            exit 1
          fi

      # ContinuousIntegrationBuild switches on by itself here (Directory.Build.props, on
      # GITHUB_ACTIONS), so the PDBs carry no runner paths and Source Link points at this commit.
      - name: Pack
        run: >
          dotnet pack src/Fili.Theme.MudAvalonia
          --configuration Release
          --output artifacts/package

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: artifacts/package/

      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing the .nupkg uploads the .snupkg beside it as well. --skip-duplicate makes a re-run
      # of a half-finished release safe: a version nuget.org already has is left alone, never
      # overwritten (nuget.org does not allow that anyway). The key reaches the command through the
      # environment, never interpolated into the script text.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/package/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/package/* \
            --title "Fili.Theme.MudAvalonia $VERSION" \
            --notes-file artifacts/release-notes.md \
            $prerelease
